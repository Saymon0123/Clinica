# Atualização de dependência sem ninguém lembrar de olhar.
#
# Existe pelo mesmo motivo do `npm audit` no CI: até 12/09/2026 o projeto não
# tinha varredura nenhuma, e o `react-router` ficou em produção com duas falhas
# ALTAS e correção disponível -- não por decisão, por ninguém ter olhado.
#
# Agrupado e com teto de 3 PRs abertos de propósito: o projeto tem um
# desenvolvedor só, e uma enxurrada de PR por semana vira uma aba que não se
# abre mais. As atualizações de **segurança** não obedecem a este teto nem ao
# agrupamento -- elas vêm na hora, por fora, e é assim que deve ser.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 3
    groups:
      producao:
        dependency-type: production
      desenvolvimento:
        dependency-type: development
    commit-message:
      prefix: Dependencias

  # As `uses:` do CI também envelhecem, e uma action abandonada é caminho de
  # ataque para dentro do pipeline -- que é justamente quem tem os segredos.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: CI
