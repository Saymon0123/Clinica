name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Rápido: não precisa de banco, roda em segundos e barra a maioria das regressões.
  estatico:
    name: Typecheck, lint e testes de unidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # O `tsc -b` cobre `src` (tsconfig.app.json) e o vite.config.ts
      # (tsconfig.node.json) -- e mais nada. As edge functions rodam em Deno e
      # até aqui estavam **fora de qualquer verificação de tipo**: erro de tipo
      # em edge só aparecia em produção, na primeira requisição que passasse
      # pela linha errada. Numa peça que roda sem ninguém olhando, isso é caro.
      #
      # `deno check` parte dos 12 `index.ts` e segue os imports, então cobre
      # `_shared` de carona. Os `.test.ts` de `_shared` ficam de fora de
      # propósito: são de vitest (Node), importam sem extensão -- que o Deno não
      # resolve -- e quem os roda é o `npm test` logo acima.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      #
      # `--node-modules-dir=none` porque o `package.json` do CRM na raiz faz o
      # Deno entrar em modo node_modules e procurar ali as dependencias npm das
      # edges -- que nunca estiveram ali. E o modo errado alem de quebrar: o
      # runtime da Supabase resolve `jsr:` e `npm:` pelo cache proprio, nao pelo
      # node_modules do front. Com `none`, a checagem passa a ser fiel ao que
      # roda em producao.
      - name: Typecheck das edge functions (Deno)
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts

  # Sobe o Postgres do Supabase, aplica as migrations do repo e roda os testes
  # de RLS em pgTAP. É o único ponto onde o isolamento entre salões é verificado.
  banco:
    name: Testes de RLS (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db

  # A trava que faltava em 11/09/2026, quando o parecer da auditoria foi para um
  # repositório público sem querer. Varre a **árvore de arquivos como ela está**,
  # não o histórico: assim o resultado depende só do que este commit traz, e
  # nunca de um segredo antigo que já foi removido do topo. Check que fica
  # vermelho por motivo histórico é check que se aprende a ignorar.
  #
  # `--redact` porque o log de CI de repositório público é público: sem ele, um
  # segredo achado seria impresso de novo, na frente de todo mundo.
  segredos:
    name: Segredos no codigo (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Baixar o gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
      # `-v` junto do `--redact` de proposito: sem ele o job falha dizendo so
      # "leaks found: 1", que nao diz onde e nao da para agir. Com os dois, sai
      # arquivo, linha e regra -- e o segredo continua mascarado.
      - name: Varrer a arvore
        run: ./gitleaks detect --no-git --redact -v --exit-code 1 --source .

  # A árvore está limpa hoje -- `npm audit` acusa 0, com as dependências de
  # desenvolvimento incluídas. Então qualquer vermelho aqui é notícia de
  # verdade, não dívida herdada.
  #
  # Este job de propósito NÃO está entre as checagens obrigatórias da `main`:
  # um aviso novo nasce do mundo lá fora, não do que o PR mudou, e travar o
  # merge por isso ensina a ignorar o vermelho. Ele existe para ser visto.
  dependencias:
    name: Vulnerabilidade nas dependencias (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
