<!-- Supabase → Authentication → Email Templates → "Reset password"
     Assunto sugerido: Seu código para criar uma nova senha — Club Cut
     IMPORTANTE: a tela "Esqueci minha senha" do CRM pede um CÓDIGO (OTP), então
     o template precisa do {{ .Token }} em destaque. O link continua junto como
     caminho alternativo. -->
<div style="font-family:system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.6;color:#1d241f;max-width:520px;margin:0 auto;padding:24px 16px">
  <div style="font-size:20px;font-weight:800;color:#1f5d42;margin-bottom:16px">Club Cut</div>

  <h2 style="font-size:18px;margin:0 0 8px">Criar uma nova senha</h2>
  <p style="margin:0 0 16px;color:#444">
    Você pediu para redefinir a senha da sua conta. Digite este código na tela do Club Cut:
  </p>

  <p style="margin:0 0 20px">
    <span style="display:inline-block;background:#e4efe8;color:#1f5d42;font-size:26px;font-weight:800;letter-spacing:6px;padding:12px 20px;border-radius:8px;font-family:monospace">{{ .Token }}</span>
  </p>

  <p style="margin:0 0 16px;color:#888;font-size:13px">
    O código vale por pouco tempo. Se preferir, este link faz a mesma coisa:
    <a href="{{ .ConfirmationURL }}" style="color:#1f5d42">criar nova senha</a>.
  </p>
  <p style="margin:0;color:#888;font-size:12px">
    Não pediu a troca? Ignore este e-mail — sua senha continua a mesma.
  </p>
</div>
