<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Tres vozes, uma requisicao. Archivo serve o CRM e a pagina de vendas
         (o display precisa do 900: em 700 a manchete perde a densidade que faz
         o tamanho valer a pena). Fraunces italico e UMA palavra por manchete,
         nunca mais que isso. IBM Plex Mono e numero e etiqueta: preco, caixa,
         comissao — o vocabulario de comanda. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Fraunces:ital,opsz,wght@1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      SEO e compartilhamento.

      A pagina nao tinha NENHUMA meta tag: sem description, sem Open Graph, sem
      Twitter card. A ironia era especifica -- o produto vende WhatsApp, e o
      link dele aparecia como URL pelada justamente no WhatsApp, que e por onde
      o dono compartilha tudo.

      A imagem foi renderizada com o Chromium a partir de um HTML (nao ha
      conversor SVG neste ambiente), em 1200x630, que e o formato que WhatsApp,
      LinkedIn e Twitter/X leem.
    -->
    <title>Club Cut — atendimento no WhatsApp para barbearia</title>
    <meta
      name="description"
      content="Ele responde a mensagem das 22h na hora, marca na agenda, e devolve a conversa quando você larga a máquina. Se o cliente perguntar se é robô, ele responde que é. 14 dias grátis, sem cartão."
    />
    <link rel="canonical" href="https://clubcut.vercel.app/inicio" />
    <meta name="theme-color" content="#0d1512" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Club Cut" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://clubcut.vercel.app/inicio" />
    <meta property="og:title" content="Suas mãos estão ocupadas. As dele não." />
    <meta
      property="og:description"
      content="Atendimento no WhatsApp para barbearia. Responde na hora, marca na agenda, e sai da frente quando você entra na conversa."
    />
    <meta property="og:image" content="https://clubcut.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Club Cut — suas mãos estão ocupadas. As dele não." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Suas mãos estão ocupadas. As dele não." />
    <meta
      name="twitter:description"
      content="Atendimento no WhatsApp para barbearia. Responde na hora, marca na agenda, e sai da frente quando você entra na conversa."
    />
    <meta name="twitter:image" content="https://clubcut.vercel.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
