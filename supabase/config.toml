project_id = "clinica-crm"

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = false

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"

[studio]
enabled = true
port = 54323

[storage]
enabled = false

[realtime]
enabled = true

[edge_runtime]
enabled = true

# JWT por funcao — versionado aqui para um deploy nunca reverter por engano o
# verify_jwt (E7 da auditoria; antes so vivia no painel). As funcoes com
# verify_jwt=false tem auth propria no corpo (assinatura do webhook, apikey) ou
# sao publicas de proposito; se subissem como true, calariam em silencio
# (Meta para de entregar, AbacatePay para de avisar pagamento, agenda publica quebra).
[functions.accept-invite]
verify_jwt = true

[functions.add-salon-unit]
verify_jwt = true

[functions.admin-create-salon]
verify_jwt = false

[functions.admin-invite-salon]
verify_jwt = true

[functions.admin-metricas]
verify_jwt = true

[functions.agenda-publica]
verify_jwt = false

[functions.abacate-webhook]
verify_jwt = false

[functions.asaas]
verify_jwt = true

[functions.cobrar-uso]
verify_jwt = true

[functions.criar-minha-barbearia]
verify_jwt = true

[functions.whatsapp]
verify_jwt = true

[functions.whatsapp-webhook]
verify_jwt = false
